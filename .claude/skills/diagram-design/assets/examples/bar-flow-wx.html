<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude 封号与申诉 · 公众号版</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .frame { max-width: 1080px; width: 100%; }
    svg { width: 100%; min-width: 1080px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Claude 半年封号与申诉成功率</title>
      <desc id="d">被封 1140 万账号，39.8 万次申诉，4.2 万次成功，申诉成功率 10.6%。</desc>
      <defs>
        <marker id="arrow" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><polygon points="0 0, 12 5, 0 10" fill="#bf4520"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="60" y="104" fill="#2d3142" font-size="60" font-weight="700" font-family="'Microsoft YaHei', sans-serif">半年封了 1140 万个账号</text>
      <text x="60" y="168" fill="#bf4520" font-size="44" font-weight="600" font-family="'Microsoft YaHei', sans-serif">申诉成功率只有 10.6%</text>

      <!-- Stage 1 -->
      <rect x="60" y="240" width="240" height="160" rx="10" fill="#ececec" stroke="#4f5d75" stroke-width="2"/>
      <text x="180" y="304" fill="#4f5d75" font-size="40" font-weight="600" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">被封禁</text>
      <text x="180" y="372" fill="#2d3142" font-size="52" font-weight="700" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">1140 万</text>

      <!-- Arrow 1 -->
      <line x1="320" y1="320" x2="424" y2="320" stroke="#bf4520" stroke-width="4" marker-end="url(#arrow)"/>
      <text x="372" y="288" fill="#bf4520" font-size="40" font-weight="600" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">0.35%</text>
      <text x="372" y="376" fill="#4f5d75" font-size="40" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">去申诉</text>

      <!-- Stage 2 -->
      <rect x="440" y="240" width="240" height="160" rx="10" fill="#ececec" stroke="#4f5d75" stroke-width="2"/>
      <text x="560" y="304" fill="#4f5d75" font-size="40" font-weight="600" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">提起申诉</text>
      <text x="560" y="372" fill="#2d3142" font-size="52" font-weight="700" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">39.8 万</text>

      <!-- Arrow 2 -->
      <line x1="700" y1="320" x2="804" y2="320" stroke="#bf4520" stroke-width="4" marker-end="url(#arrow)"/>
      <text x="752" y="288" fill="#bf4520" font-size="40" font-weight="600" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">10.6%</text>
      <text x="752" y="376" fill="#4f5d75" font-size="40" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">成功</text>

      <!-- Stage 3 -->
      <rect x="820" y="240" width="200" height="160" rx="10" fill="rgba(191,69,32,0.12)" stroke="#bf4520" stroke-width="2"/>
      <text x="920" y="304" fill="#bf4520" font-size="40" font-weight="600" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">成功</text>
      <text x="920" y="372" fill="#bf4520" font-size="52" font-weight="700" font-family="'Microsoft YaHei', sans-serif" text-anchor="middle">4.2 万</text>

      <text x="60" y="480" fill="#4f5d75" font-size="40" font-family="'Microsoft YaHei', sans-serif">上一周期是 145 万，半年翻了近八倍</text>
      <text x="60" y="536" fill="#bf4520" font-size="40" font-weight="600" font-family="'Microsoft YaHei', sans-serif">1140 万里有多少误伤，官方没有公布</text>
    </svg>
  </div>
</body>
</html>
