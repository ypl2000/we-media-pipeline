<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50.1% 的投票权</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .frame { max-width: 1080px; width: 100%; }
    svg { width: 100%; min-width: 1080px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Anthropic 招股书里的投票权分配</title>
      <desc id="d">七位创始人的 Class F 股票掌握 50.1% 投票权，公众股东持 49.9%。</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="60" y="104" fill="#2d3142" font-size="60" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">50.1% 的投票权</text>
      <text x="60" y="164" fill="#4f5d75" font-size="40" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">七位创始人，一票锁在一股上</text>

      <!-- Outer container -->
      <rect x="60" y="216" width="960" height="220" rx="10" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="2"/>
      <text x="88" y="264" fill="#4f5d75" font-size="40" font-weight="600" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">股东大会的全部投票权</text>

      <!-- Left inner: founders (focal) -->
      <rect x="88" y="296" width="440" height="112" rx="8" fill="rgba(191,69,32,0.14)" stroke="#bf4520" stroke-width="2"/>
      <text x="120" y="368" fill="#bf4520" font-size="52" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">50.1%</text>
      <text x="500" y="368" fill="#bf4520" font-size="40" font-weight="600" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="end">七位创始人</text>

      <!-- Right inner: public -->
      <rect x="552" y="296" width="440" height="112" rx="8" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="2"/>
      <text x="584" y="368" fill="#2d3142" font-size="52" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">49.9%</text>
      <text x="964" y="368" fill="#4f5d75" font-size="40" font-weight="600" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="end">公众股东</text>

      <text x="60" y="504" fill="#bf4520" font-size="40" font-weight="600" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">新股发行也不稀释</text>
    </svg>
  </div>
</body>
</html>
