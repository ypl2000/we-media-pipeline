<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manus 的 20 个月</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .frame { max-width: 1080px; width: 100%; }
    svg { width: 100%; min-width: 1080px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Manus 的 20 个月</title>
      <desc id="d">时间线显示 2025 年 3 月发布、2026 年上半年收购被叫停、8 月恢复独立运营、10 月融资 5 亿美元。</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="60" y="104" fill="#2d3142" font-size="60" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">Manus 的 20 个月</text>

      <!-- Baseline -->
      <line x1="80" y1="340" x2="1000" y2="340" stroke="rgba(79,93,117,0.45)" stroke-width="2"/>

      <!-- E1 2025.03 (below) -->
      <line x1="120" y1="340" x2="120" y2="400" stroke="#4f5d75" stroke-width="2"/>
      <circle cx="120" cy="340" r="8" fill="#2d3142"/>
      <text x="120" y="440" fill="#4f5d75" font-size="40" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">2025.03</text>
      <text x="120" y="492" fill="#2d3142" font-size="40" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">发布</text>

      <!-- E2 2026 上半年 (above) -->
      <line x1="440" y1="280" x2="440" y2="340" stroke="#4f5d75" stroke-width="2"/>
      <circle cx="440" cy="340" r="8" fill="#2d3142"/>
      <text x="440" y="240" fill="#4f5d75" font-size="40" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">2026 上半年</text>
      <text x="440" y="188" fill="#2d3142" font-size="40" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">收购被叫停</text>

      <!-- E3 2026.08 (below) -->
      <line x1="720" y1="340" x2="720" y2="400" stroke="#bf4520" stroke-width="2"/>
      <circle cx="720" cy="340" r="10" fill="#bf4520"/>
      <text x="720" y="440" fill="#bf4520" font-size="40" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">2026.08</text>
      <text x="720" y="492" fill="#2d3142" font-size="40" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="middle">恢复独立</text>

      <!-- E4 2026.10 (above) -->
      <line x1="980" y1="280" x2="980" y2="340" stroke="#bf4520" stroke-width="2"/>
      <circle cx="980" cy="340" r="10" fill="#bf4520"/>
      <text x="980" y="240" fill="#bf4520" font-size="40" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="end">2026.10</text>
      <text x="980" y="188" fill="#2d3142" font-size="40" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="end">估值 40 亿美元</text>

      <text x="1020" y="104" fill="rgba(45,49,66,0.30)" font-size="40" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="end">按真实时间比例</text>
    </svg>
  </div>
</body>
</html>
