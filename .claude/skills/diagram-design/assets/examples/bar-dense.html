<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算力承诺 vs 账上现金</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', sans-serif; background: #f5f5f5; color: #2d3142; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .frame { max-width: 1080px; width: 100%; }
    svg { width: 100%; min-width: 1080px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 1080 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
      <title id="t">Anthropic 算力承诺与账上现金对比</title>
      <desc id="d">四根横条对比媒体加总上限 8070 亿美元、路透十年期 5180 亿美元、不可撤销付款义务 4300 亿美元与账上现金 1316 亿美元。</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="60" y="104" fill="#2d3142" font-size="60" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">算力承诺 vs 账上现金（亿美元）</text>

      <!-- Row 1 -->
      <text x="60" y="212" fill="#2d3142" font-size="40" font-weight="600" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">媒体加总上限</text>
      <text x="1020" y="212" fill="#2d3142" font-size="40" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="end">8,070</text>
      <rect x="60" y="228" width="960" height="32" fill="rgba(79,93,117,0.18)" stroke="#4f5d75" stroke-width="2"/>

      <!-- Row 2 -->
      <text x="60" y="312" fill="#2d3142" font-size="40" font-weight="600" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">路透十年期口径</text>
      <text x="1020" y="312" fill="#2d3142" font-size="40" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="end">5,180</text>
      <rect x="60" y="328" width="616" height="32" fill="rgba(79,93,117,0.18)" stroke="#4f5d75" stroke-width="2"/>

      <!-- Row 3 -->
      <text x="60" y="412" fill="#2d3142" font-size="40" font-weight="600" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">不可撤销付款义务</text>
      <text x="1020" y="412" fill="#2d3142" font-size="40" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="end">4,300</text>
      <rect x="60" y="428" width="512" height="32" fill="rgba(79,93,117,0.18)" stroke="#4f5d75" stroke-width="2"/>

      <!-- Row 4 — focal -->
      <text x="60" y="512" fill="#bf4520" font-size="40" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">账上现金及短期投资</text>
      <text x="1020" y="512" fill="#bf4520" font-size="40" font-weight="700" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" text-anchor="end">1,316</text>
      <rect x="60" y="528" width="157" height="32" fill="rgba(191,69,32,0.15)" stroke="#bf4520" stroke-width="2"/>

      <text x="60" y="628" fill="#bf4520" font-size="40" font-weight="600" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif">现金只覆盖加总口径的约 16%</text>
    </svg>
  </div>
</body>
</html>
