export const meta = {
  name: 'run-pipeline',
  description: 'Run the WeChat article generation pipeline. Three gates: an AI critic on the article (auto-rewrites up to 5x), hard validation of content.json, and a five-question narration gate on 06_storyboard.json (only the voice-over text is shown to the critic). Pass human_review: true to stop at each checkpoint instead. Video routing: <=12s renders locally from 06_content.json; >12s writes 08_eac_handoff.json for the EAC MCP line instead of a local mp4. Ends by pushing the article to the 公众号 draft box (needs WECHAT_APP_ID/WECHAT_APP_SECRET env vars; publish: false to skip).',
  phases: [
    { title: 'Search' },
    { title: 'Article' },
    { title: 'Review-Article' },
    { title: 'DeAI' },
    { title: 'Xiaohei' },
    { title: 'Illustrate' },
    { title: 'Diagram' },
    { title: 'PPT' },
    { title: 'ImageDownload' },
    { title: 'Word' },
    { title: 'Summarize' },
    { title: 'Review-Summary' },
    { title: 'Storyboard' },
    { title: 'Review-Storyboard' },
    { title: 'Video' },
    { title: 'Publish' },
  ],
}

const MAX_RETRIES = 3

function humanReviewRequested(flag) {
  return flag === true
}

// Resolve the project root and the output root, then create the topic directory.
// Root priority: args.output_dir > config.json "default_output_dir".
const setup = await agent(
  `确定项目根目录（仓库根）和本次流水线的输出根目录，并建好目录。

1. 先确定项目根目录，在仓库里运行：
   git rev-parse --show-toplevel
   把 stdout 原样记为项目根目录（完整路径）。命令失败（不在 git 仓库里）就返回错误并停止。

2. 如果调用方指定了输出根目录，直接用它：${args.output_dir || '（未指定）'}
3. 否则运行（Windows 下用 python，路径含空格要加引号）：
   python "<项目根目录>/shared/config_loader.py" --get default_output_dir
   把 stdout 原样当作输出根目录。
4. 在根目录下创建子目录 "${args.topic}" 和 "${args.topic}/_work"（不存在才建，不要用 rm）。

## 返回格式（JSON）
{ "project_root": "项目根目录完整路径", "output_root": "输出根目录完整路径" }`,
  {
    schema: {
      type: 'object',
      properties: {
        project_root: { type: 'string' },
        output_root: { type: 'string' },
      },
      required: ['project_root', 'output_root'],
    }
  }
)

// 项目根目录由 setup agent 用 git rev-parse 得出，仓库搬家不用改这里
const PROJECT_ROOT = String(setup.project_root || '').trim()
if (!PROJECT_ROOT) throw new Error('未能确定项目根目录（git rev-parse --show-toplevel 失败）')

// guard: setup agent sometimes already appends the topic dir — don't double it
const _root = setup.output_root.trim().replace(/[\\/]+$/, '')
const OUT = _root.toLowerCase().endsWith(String(args.topic).toLowerCase()) ? _root : _root + '\\' + args.topic
log(`Output root: ${setup.output_root} -> ${OUT}`)

// guard: 产物不许写进代码仓库
const _norm = (p) => String(p).replace(/\\/g, '/').replace(/\/+$/, '').toLowerCase()
const _projLower = _norm(PROJECT_ROOT)
if (_norm(OUT).startsWith(_projLower + '/') || _norm(OUT) === _projLower) {
  throw new Error(`输出目录不能位于代码仓库内: ${OUT}（仓库: ${PROJECT_ROOT}）`)
}

// ─── Phase 1: Search ──────────────────────────────────────────────────────────

phase('Search')
let searchResult = null

for (let attempt = 1; attempt <= MAX_RETRIES && !searchResult?.success; attempt++) {
  try {
    searchResult = await agent(
      `在 ${OUT} 目录下执行新闻搜索，保存结果到 01_search_results.md。

## 任务
调用搜索脚本拿新闻，保存 markdown 格式结果。

**不要自己手写 HTTP 请求去调 Metaso/Tavily** —— 脚本里已经处理好了 provider 选择、
日期过滤和图片 URL 导出，手写会绕过这些逻辑。

## 步骤
1. 运行（Windows 下用 python，路径含空格要加引号）：
   python "${PROJECT_ROOT}\\news-searcher\\scripts\\search_news.py" "${args.topic}" -d ${args.days || 7} -n ${args.num_results || 10} -f markdown -o "${OUT}\\01_search_results.md"

2. 脚本会写出两个文件：
   - ${OUT}/01_search_results.md（搜索结果）
   - ${OUT}/01_news_images.json（图片 URL 数组，没有就是 []）

3. 读 01_search_results.md 的内容，作为 research_content。

## 脚本的失败语义（重要）
- 脚本会在本地按日期过滤掉超出 DAYS 的旧结果。**Metaso 的 recency_days 参数是失效的**，
  所以过滤是唯一有效的时效保证。
- 近 DAYS 天内不足 3 条时脚本会失败退出，返回 success=false。
  **绝对不许改宽搜索词、减小天数窗口、或拿旧结果凑数。**

## 返回格式（JSON）
{
  "success": boolean,
  "output_dir": "${OUT}",
  "research_file": "完整路径",
  "research_content": "01_search_results.md 文件内容（string）",
  "results_count": number,
  "images_count": number,
  "error": "错误信息（如果有）"
}

如果搜索失败（success=false），抛出错误让流程停止。`,
      {
        schema: {
          type: 'object',
          properties: {
            success: { type: 'boolean' },
            output_dir: { type: 'string' },
            research_file: { type: 'string' },
            research_content: { type: 'string' },
            results_count: { type: 'number' },
            images_count: { type: 'number' },
          },
          required: ['success', 'output_dir', 'research_file'],
        }
      }
    )
  } catch (err) {
    if (attempt === MAX_RETRIES) throw err
    log(`Search attempt ${attempt} failed: ${String(err)}`)
  }
}

if (!searchResult?.success) throw new Error('Search failed: ' + (searchResult?.error || 'unknown'))

const stylePath = args.style_topic
  ? PROJECT_ROOT + '\\reference\\' + args.style_topic + '\\style.md'
  : PROJECT_ROOT + '\\reference\\style-guide.md'
log(`Search done: ${searchResult.results_count} articles, ${searchResult.images_count} images`)

// ─── Phase 2: Article Generation ─────────────────────────────────────────────

phase('Article')
let articleFile = '', articleContent = ''

for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
  try {
    const r = await agent(
      `读取新闻搜索结果，生成微信公众号文章，保存到 02_raw_article.md。

## 输入
- 研究资料: ${searchResult.research_content}（01_search_results.md 全文）
- 风格指南: ${stylePath}

## 文章要求
1. 根据 style-guide 生成，标题必须有悬念或冲突
2. 结构: 标题 → 正文（## 章节）→ ## 写在最后
3. **不需要写任何图片占位符**，图片由后续步骤处理
4. **不要写任何 {{...}} 模板标记**（如 {{chart:...}}），没有渲染器会处理它们
5. 字数 2500-3500 中文字符
6. 对话风格但专业，第一人称视角
7. **正文第一句不能复述标题**：标题是问句时，开篇直接给具体事件/数据/场景，不要把标题的问题再抛一遍

## 输出
保存到 ${OUT}/02_raw_article.md

## 返回格式（JSON）
{
  "success": boolean,
  "article_file": "完整路径",
  "article_content": "文件完整内容（string）"
}

如果生成失败，抛出错误让流程停止。`,
      {
        schema: {
          type: 'object',
          properties: {
            success: { type: 'boolean' },
            article_file: { type: 'string' },
            article_content: { type: 'string' },
          },
          required: ['success', 'article_file'],
        }
      }
    )

    if (r?.success) {
      articleFile = r.article_file
      articleContent = r.article_content
      log(`Article generated: ${articleFile} (${articleContent.length} chars)`)
      break
    } else {
      throw new Error(r.error || 'Article generation failed')
    }
  } catch (err) {
    if (attempt === MAX_RETRIES) throw err
    log(`Article attempt ${attempt} failed: ${String(err)}`)
  }
}

// ─── Review Point 1 ─────────────────────────────────────────────────────────────
phase('Review-Article')
log(`Article ready: ${articleFile} (${articleContent.length} chars)`)

if (humanReviewRequested(args.human_review)) {
  log(`\n========== 人工审查点 ==========`)
  log(`文章: ${articleFile}`)
  log(`开头预览:\n${articleContent.slice(0, 600)}`)
  log(`===============================`)
  log(`workflow 已暂停。确认无误后带 human_review: false 重新运行以继续。`)
  return {
    success: false,
    awaiting: 'article-review',
    output_dir: OUT,
    article_file: articleFile,
    preview: articleContent.slice(0, 1200),
  }
}

const MAX_REVIEW_ROUNDS = 5

for (let rewrite = 1; rewrite <= MAX_REVIEW_ROUNDS; rewrite++) {
  let verdict
  try {
    verdict = await agent(
      `审查这篇文章，判断是否可以直接进入配图和导出环节。

## 待审文章
${articleFile}

## 审查标准（任一不合格就打回）
1. 字数 2500-3500 中文字符，明显不足或超标 → 打回
2. 标题有悬念或冲突 → 打回
3. 有「## 写在最后」→ 缺则打回
4. 正文有 ## 分节，节与节之间不是重复表达 → 打回
5. 事实与搜索结果一致，没有编造的数字、时间、公司名 → 打回
6. 通篇没有 AI 味开场白 → 打回
7. 正文第一句在复述标题（把标题的问句/结论又说一遍）→ 打回

## 返回格式（JSON）
{
  "approved": boolean,
  "issues": ["具体问题1", "具体问题2"],
  "severity": "high" | "medium" | "low"
}

approved=false 时 issues 必须是可直接执行的重写指令。`,
      {
        schema: {
          type: 'object',
          properties: {
            approved: { type: 'boolean' },
            issues: { type: 'array', items: { type: 'string' } },
            severity: { type: 'string' },
          },
          required: ['approved', 'issues'],
        }
      }
    )
  } catch (err) {
    log(`Review round ${rewrite} failed: ${String(err)} — proceeding with current article`)
    break
  }

  if (verdict?.approved) {
    log(`Review passed (round ${rewrite})`)
    break
  }

  log(`Review round ${rewrite} rejected (${verdict?.severity || 'unknown'}): ${(verdict?.issues || ['（未返回具体意见）']).join('; ')}`)
  if (rewrite === MAX_REVIEW_ROUNDS) {
    log(`Review still failing after ${MAX_REVIEW_ROUNDS} rounds — proceeding with current article`)
    break
  }

  let fixed
  try {
    fixed = await agent(
      `按审查意见重写这篇文章，覆盖保存。

## 审查意见（必须逐条修掉）
${(verdict?.issues || ['（未返回具体意见）']).map((issue, i) => `${i + 1}. ${issue}`).join('\n')}

## 原文
${articleFile}

## 约束
- 保留原有的搜索素材和事实，不要编造
- 字数保持 2500-3500 中文字符
- 改完覆盖保存原文件

## 返回格式（JSON）
{
  "success": boolean,
  "file": "<完整路径>",
  "content": "改写后的完整文章内容"
}`,
      {
        schema: {
          type: 'object',
          properties: {
            success: { type: 'boolean' },
            file: { type: 'string' },
            content: { type: 'string' },
          },
          required: ['success', 'file', 'content'],
        }
      }
    )
  } catch (err) {
    log(`Rewrite round ${rewrite} failed: ${String(err)} — proceeding with current article`)
    break
  }

  if (fixed?.success) {
    articleFile = fixed.file
    articleContent = fixed.content
    log(`Rewritten: ${articleFile} (${articleContent.length} chars)`)
  }
}

// ─── Phase 3: DeAI ────────────────────────────────────────────────────────────

phase('DeAI')
let deaiFile = '', deaiContent = ''

for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
  try {
    const r = await agent(
      `读取文章，去除 AI 写作模式，保存到 03_article.md。

## 输入
- 文章: ${articleFile}
- 输出目录: ${OUT}

## 去AI味规则
1. 删除开头铺垫短语
2. 删除强调套路
3. 替换商业黑话为直白语言
4. 删除所有副词（特别是 -ly 结尾的词）
5. 删除填充短语
6. 避免二元对比结构
7. 避免戏剧性碎片化短句
8. 避免"人们"，用"你"或具体人
9. 避免被动语态
10. 保持 2500+ 中文字符
11. **禁止修改或替换 [[IMG:...]] 占位符**，原样保留。
12. 保留标题不变，正文第一句不得变成标题的复述

## 输出
保存到 ${OUT}/03_article.md

## 返回格式（JSON）
{
  "success": boolean,
  "file": "完整路径",
  "content": "文件完整内容（string）"
}

如果 LLM API 错误，抛出错误让流程停止。`,
      {
        schema: {
          type: 'object',
          properties: {
            success: { type: 'boolean' },
            file: { type: 'string' },
            content: { type: 'string' },
          },
          required: ['success', 'file'],
        }
      }
    )

    if (r?.success) {
      deaiFile = r.file
      deaiContent = r.content
      log(`DeAI done: ${deaiFile} (${deaiContent.length} chars)`)
      break
    } else {
      throw new Error(r.error || 'DeAI failed')
    }
  } catch (err) {
    if (attempt === MAX_RETRIES) throw err
    log(`DeAI attempt ${attempt} failed: ${String(err)}`)
  }
}

// ─── Phase 4: Xiaohei ───────────────────────────────────────────────────────

phase('Xiaohei')

for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
  try {
    const r = await agent(
      `生成小黑风格定制配图（Ian xiaohei illustration），把图片路径写进 Markdown。

## 输入
- 文章: ${deaiFile}
- 图片输出目录: ${OUT}/images_good

## 步骤
1. 分析文章，找到 4-6 个最适合用视觉表达的关键认知点
   （不要平均分段，只挑最值得配图的认知锚点）
2. 为每张图写**一句**英文 scene 描述（**不超过 200 字符**），只说主角在干什么、周围有什么。
   不要写风格、不要写"不要画文字"——脚本自带固定风格模板和禁字条款，你写了反而会把 prompt 撑长画歪。
3. **给每张图选一个主角（character），别让每张图都是同一个**。可选：
   line_person（火柴小人）、cat（猫）、robot（机器人）、dot（小点）、none（不要角色）。
   一篇 4-6 张图里至少用 2-3 种不同角色；scene 里的称呼要和 character 一致
   （character=cat 就写 "the cat"，不要写 "the blob"）。
4. 为每张图挑 2-4 个中文标注词（**日常常用词**，逗号分隔），后期由脚本叠到画面上。
5. 把所有图写成一个 JSON 文件（例如 ${OUT}\\_work\\xiaohei_prompts.json），格式：
   [{"scene": "the cat pushes a cart along a line with four stations", "character": "cat", "labels": "写剧本,出画面", "out": "${OUT}\\images_good\\xiaohei_01.png"}, ...]
6. **画图 + 叠中文标注 + 自动检查，一条命令画完（脚本内部并发），不要自己手写 HTTP 请求**：
   python "${PROJECT_ROOT}\\we-media-pipeline\\scripts\\gen_image.py" --prompts-file "<上面那个 json 的路径>" --verify
   脚本会自己检查每张图（有没有偷偷写字、画面画的对不对），不合格的重画一遍。
7. **如果输出的 JSON 里 "failed" 数组不为空**：读每张图的 reason，把那几张的 scene 描述改得更具体更直白
   （例如把 "the cat works on AI drama" 改成 "the cat carries a stack of scripts toward a big screen"），
   改完只对这几张重跑一次脚本。最多重跑一次，还不行就用这版，别无限重试。
8. **最重要的一步**：读 ${deaiFile}，在文章中「最合适」的位置插入图片占位符：
   - 不是追加到末尾，而是找到与这张图最相关的段落位置
   - 写入一行: [[IMG: images_good/xiaohei_01.png]]
   - 如果生成多张，每张找各自的位置写一行
9. 覆盖保存 ${deaiFile}

## 硬约束（实测出来的，不照做就会画歪或写错字）
- **scene 描述不超过 200 字符**，一句话说清主角在干什么，不堆砌修饰词。
- **画面里不会有任何文字**。中文标注是脚本后期用程序叠上去的，模型写汉字必有错字。
- 标注词 **最多 4 个**，每个 **2-4 个字**，用 **逗号分隔**（如: 写剧本,出画面,发布）
- 标注词必须是**日常常用词**，避开生僻字和行业术语（模型写不对「配音」「工业化」这类词）

## Shot list（不需要单独文件，直接把 placement 信息落到 Markdown 里）

## 返回格式（JSON）
{
  "success": boolean,
  "shot_count": number,
  "image_files": ["完整路径列表"],
  "placed_count": number,  // 实际写入 Markdown 的占位符数量
  "error": "错误信息（如果有）"
}

如果 API key 不存在或生成失败，success=false 但不阻止流程继续。`,
      {
        schema: {
          type: 'object',
          properties: {
            success: { type: 'boolean' },
            shot_count: { type: 'number' },
            image_files: { type: 'array', items: { type: 'string' } },
            placed_count: { type: 'number' },
          },
          required: ['success'],
        }
      }
    )

    if (r?.success) {
      log(`Xiaohei done: ${r.shot_count} images, ${r.placed_count} placeholders written to markdown`)
      break
    } else {
      log(`Xiaohei failed: ${r.error} — continuing`)
      break
    }
  } catch (err) {
    if (attempt === MAX_RETRIES) {
      log(`Xiaohei failed after ${MAX_RETRIES} attempts: ${String(err)}`)
      break
    }
    log(`Xiaohei attempt ${attempt} failed: ${String(err)}`)
  }
}

// ─── Phase 5: Illustrate ──────────────────────────────────────────────────────
//

phase('Illustrate')

for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
  try {
    const r = await agent(
      `给文章补 2-3 张**通用风格**配图（跟小黑配图互补，不要重复同一个认知点），把图片路径写进 Markdown。

## 输入
- 文章: ${deaiFile}
- 图片输出目录: ${OUT}/images_good

## 可选风格（每张图选一个，同一篇文章里不要连着用同一个风格）
notion / warm / minimal / blueprint / watercolor / flat / editorial
（xiaohei 是小黑那一步用的，这里不要用）

## 步骤
1. 读文章，挑 2-3 个**适合画成图解、对比、流程或概念图**的段落
   （小黑那步画的是「小黑在干嘛」，这里要画「结构、关系、对比」，两边的认知点不要重复）
2. 每张图：选一个风格 + 写**一句**英文 scene 描述（**不超过 200 字符**）+ 2-4 个中文标注词
   - scene 只说画面里有什么东西、怎么排布，别写风格本身（脚本会套模板）
   - 标注词用**日常常用词**，逗号分隔，中文标注是脚本后期贴上去的
3. 把所有图写成一个 JSON 文件 ${OUT}\\_work\\illustrate_prompts.json，格式：
   [{"scene": "a three step pipeline diagram, arrows from left to right", "labels": "投喂,生成,审核", "style": "blueprint", "out": "${OUT}\\images_good\\illu_01.png"}, ...]
4. **画图 + 叠中文标注 + 自动检查，一条命令画完（脚本内部并发），不要自己手写 HTTP 请求**：
   python "${PROJECT_ROOT}\\we-media-pipeline\\scripts\\gen_image.py" --prompts-file "${OUT}\\_work\\illustrate_prompts.json" --verify
5. **如果输出的 JSON 里 "failed" 数组不为空**：读每张图的 reason，把那几张的 scene 改得更具体更直白，
   只对这几张重跑一次脚本。最多重跑一次，还不行就用这版，别无限重试。
6. 读 ${deaiFile}，在文章中「最合适」的位置插入图片占位符：
   - 写入一行: [[IMG: images_good/illu_01.png]]
   - 每张图找各自最相关的段落位置插入，不要全堆在末尾
7. 覆盖保存 ${deaiFile}

## 硬约束
- **scene 描述不超过 200 字符**，一句话说清画面内容和布局，不堆砌修饰词。
- 标注词 **最多 4 个**，每个 **2-4 个字**，**逗号分隔**，必须是日常常用词。
- 临时文件只放 ${OUT}\\_work\\，**不要用 rm -rf**（非交互模式下会永远卡住）。

## 返回格式（JSON）
{
  "success": boolean,
  "shot_count": number,
  "image_files": ["完整路径列表"],
  "placed_count": number,
